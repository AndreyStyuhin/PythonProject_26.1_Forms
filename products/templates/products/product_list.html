<!-- products/templates/products/product_list.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body>
    <h1>Product list</h1>

    {% if user.is_authenticated %}
        <a href="{% url 'products:product_create' %}">Add New Product</a>
    {% endif %}

    <ul>
        {% for product in object_list %}
            <li>
                {{ product.name }}
                {% if user.is_authenticated %}
                    <a href="{% url 'products:product_update' product.pk %}">Edit</a> |
                    <a href="{% url 'products:product_delete' product.pk %}">Delete</a>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
